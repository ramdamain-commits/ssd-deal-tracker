<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 SSD Deal Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>PS5 SSD Deal Tracker</h1>
    <p id="updated-at">最終更新: 読み込み中...</p>
  </header>
  <main>
    <!-- フィルタバー -->
    <div id="filter-bar" class="filter-bar" role="group" aria-label="製品フィルタ">

      <div class="filter-group">
        <span class="filter-label">メーカー</span>
        <div class="filter-pills" role="group" aria-label="メーカーフィルタ">
          <button class="pill active" data-filter="brand" data-value="all" aria-pressed="true">全て</button>
          <button class="pill" data-filter="brand" data-value="wd" aria-pressed="false">WD</button>
          <button class="pill" data-filter="brand" data-value="crucial" aria-pressed="false">Crucial</button>
          <button class="pill" data-filter="brand" data-value="kioxia" aria-pressed="false">KIOXIA</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label">ステータス</span>
        <div class="filter-pills" role="group" aria-label="ステータスフィルタ">
          <button class="pill active" data-filter="status" data-value="all" aria-pressed="true">全て</button>
          <button class="pill" data-filter="status" data-value="買い時" aria-pressed="false">買い時</button>
          <button class="pill" data-filter="status" data-value="高め" aria-pressed="false">高め</button>
          <button class="pill" data-filter="status" data-value="未取得" aria-pressed="false">未取得</button>
        </div>
      </div>

    </div>

    <!-- フィルタ結果なし表示 -->
    <p id="no-results" class="no-results" hidden>条件に一致する製品がありません。</p>

    <div id="product-cards" class="card-grid"></div>
    <section id="chart-section">
      <h2>価格推移</h2>
      <canvas id="price-chart"></canvas>
    </section>
  </main>
  <footer>
    <p>※ 価格.com表示価格。送料別の場合があります。</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
